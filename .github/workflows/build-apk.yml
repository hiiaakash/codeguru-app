name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check game file exists
        run: test -s app/src/main/assets/www/index.html && test -s app/src/main/assets/www/vendor/pyodide/pyodide.asm.wasm

      - name: Add numpy, pandas, scikit-learn and matplotlib for offline Python
        run: python3 tools/fetch_pyodide_packages.py app/src/main/assets/www/vendor/pyodide

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK (pre-installed on runner)
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "Android SDK: $SDK"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;34.0.0"
          echo "sdk.dir=$SDK" > local.properties

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set version
        run: |
          echo "VERSION_CODE=$((GITHUB_RUN_NUMBER + 10))" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=1.3-build${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: Prepare signing key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: env.KEYSTORE_BASE64 != ''
        run: gradle --no-daemon assembleRelease

      - name: Build debug APK (no signing key in secrets)
        if: env.KEYSTORE_BASE64 == ''
        run: gradle --no-daemon assembleDebug

      - name: Collect APK
        run: |
          mkdir -p dist
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/CodeGuru-${VERSION_NAME}.apk"
          else
            cp app/build/outputs/apk/debug/app-debug.apk "dist/CodeGuru-${VERSION_NAME}-debug.apk"
          fi
          ls -l dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CodeGuru-APK
          path: dist/*.apk

      - name: Publish GitHub Release (only for v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
